<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmer Mood Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>💻 Programmer Mood Detector</h1>

        <div class="card">
            <label>Bugs Found Today 🐛</label>
            <input type="number" id="bugs" placeholder="Enter number of bugs">

            <label>Cups of Coffee ☕</label>
            <input type="number" id="coffee" placeholder="Enter coffee count">

            <button onclick="detectMood()">
                Detect My Mood
            </button>

            <div id="result"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
